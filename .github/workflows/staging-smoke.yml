name: Staging smoke test

on:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  smoke:
    environment: staging
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - run: npx playwright install --with-deps chromium
      - run: npm run test:e2e:staging -- --project=desktop-chromium
        env:
          E2E_BASE_URL: ${{ secrets.E2E_BASE_URL }}
          E2E_STAGING_EMAIL: ${{ secrets.E2E_STAGING_EMAIL }}
          E2E_STAGING_PASSWORD: ${{ secrets.E2E_STAGING_PASSWORD }}
